<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Panel administrativo de West Marches Reynosa">
  <title>Admin | West Marches Reynosa</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-shell { max-width: 1240px; margin: 0 auto; padding: 28px 18px 60px; }
    .admin-login { max-width: 520px; margin: 50px auto; padding: 24px; }
    .admin-grid { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 18px; }
    .admin-sidebar, .admin-content { padding: 18px; }
    .admin-menu { display: grid; gap: 7px; }
    .admin-menu button, .admin-button {
      border: 1px solid #435169; border-radius: 7px; background: #0a1423;
      color: var(--cream); padding: 9px 11px; cursor: pointer; text-align: left;
    }
    .admin-menu button.active { border-color: var(--gold); color: var(--gold-bright); background: #17243a; }
    .admin-toolbar { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 14px; }
    .admin-table { overflow: auto; max-height: 460px; border: 1px solid #354156; border-radius: 8px; }
    .admin-table table { width: 100%; border-collapse: collapse; }
    .admin-table th, .admin-table td { padding: 9px; border-bottom: 1px solid #354156; text-align: left; font-size: .78rem; }
    .admin-table th { color: var(--gold-bright); background: #0d1828; position: sticky; top: 0; }
    .admin-table button { cursor: pointer; }
    .admin-form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
    .admin-form label { display: grid; gap: 5px; color: var(--muted); font-size: .72rem; font-weight: 800; }
    .admin-form input, .admin-form textarea, .admin-form select {
      width: 100%; box-sizing: border-box; border: 1px solid #435169; border-radius: 7px;
      background: #0a1423; color: var(--cream); padding: 9px;
    }
    .admin-form textarea { min-height: 120px; resize: vertical; }
    .admin-wide { grid-column: 1 / -1; }
    .admin-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .admin-message { min-height: 20px; color: #83cc8f; }
    .admin-message.error { color: #e58a81; }
    .admin-danger { border-color: #84443f !important; color: #e9a09a !important; }
    .admin-help { color: var(--muted); font-size: .78rem; }
    .admin-login-form { display: grid; gap: 12px; margin-top: 18px; }
    .admin-login-form label { display: grid; gap: 5px; color: var(--muted); font-size: .75rem; }
    .admin-login-form input { border: 1px solid #435169; border-radius: 7px; background: #0a1423; color: var(--cream); padding: 10px; }
    @media (max-width: 760px) {
      .admin-grid { grid-template-columns: 1fr; }
      .admin-form { grid-template-columns: 1fr; }
      .admin-wide { grid-column: auto; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <p class="brand-kicker">Administración</p>
      <h1>West Marches Reynosa</h1>
    </div>
    <nav class="main-nav" aria-label="Navegación administrativa">
      <a href="index.html">Volver al portal</a>
    </nav>
  </header>

  <main class="admin-shell">
    <section id="admin-login" class="card admin-login">
      <p class="section-kicker">Acceso restringido</p>
      <h2>Panel Admin</h2>
      <p class="admin-help">Usuario configurado: Miguel. La contraseña se valida en Cloudflare mediante ADMIN_PASSWORD.</p>
      <form id="admin-login-form" class="admin-login-form">
        <label>Usuario<input id="admin-username" name="username" value="Miguel" autocomplete="username" required></label>
        <label>Contraseña<input id="admin-password" name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="admin-button">Entrar</button>
      </form>
      <p id="admin-login-message" class="admin-message" aria-live="polite"></p>
    </section>

    <section id="admin-panel" hidden>
      <div class="section-heading">
        <div><p class="section-kicker">Control central</p><h2>Administración de campaña</h2></div>
        <button id="admin-logout" type="button" class="admin-button">Cerrar sesión</button>
      </div>

      <div class="admin-grid">
        <aside class="card admin-sidebar">
          <p class="section-kicker">Secciones</p>
          <div id="admin-menu" class="admin-menu"></div>
        </aside>

        <section class="card admin-content">
          <div class="admin-toolbar">
            <div><p class="section-kicker" id="admin-entity-kicker">Datos</p><h2 id="admin-entity-title">Personajes</h2></div>
            <button id="admin-new" type="button" class="admin-button">Nuevo registro</button>
          </div>

          <p id="admin-help" class="admin-help"></p>
          <div id="admin-table" class="admin-table"></div>

          <form id="admin-form" class="admin-form"></form>

          <div class="admin-actions">
            <button id="admin-save" type="button" class="admin-button">Guardar</button>
            <button id="admin-delete" type="button" class="admin-button admin-danger">Eliminar</button>
          </div>
          <p id="admin-message" class="admin-message" aria-live="polite"></p>
        </section>
      </div>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
